# ============================================================
#  Chapitre 1 — Le Départ
#  Lance : python tools/cli.py run examples/chapter1.yaml
# ============================================================

characters:
  pilot:
    name: Pilote
    image: assets/characters/Pilot2.png
    position: right

  settler:
    name: Settler
    image: assets/characters/Settler2.png
    position: left

scenes:

  - id: ch1_intro
    background: assets/bg/bg_spaceship.jpg
    music: assets/audio/Forgotten Biomes.ogg
    character_dim: 100

    characters:
      - settler
      - pilot

    actions:
      - set:
          credits: 120
          reputation: 4
          player_name: Voyageur

      - settler: "Bienvenue à bord, {player_name}. Destination : Station Kepler-7."
      - pilot: "Vous avez {credits} crédits. Le voyage sera long."

      - choice:
          - text: "Acheter des provisions (+confort, -30 crédits)"
            condition: "credits >= 30"
            set:
              credits: "credits - 30"
              has_provisions: true
            actions:
              - settler: "Bonne idée. Les provisions sont chargées."

          - text: "Partir sans provisions"
            set:
              has_provisions: false
            actions:
              - pilot: "Risqué... mais vous économisez {credits} crédits."

      - settler: "Tout est prêt. On y va !"
      - goto: ch1_hyperespace

  - id: ch1_hyperespace
    background: assets/bg/bg_spaceship.jpg
    character_dim: 180

    characters:
      - pilot

    actions:
      - pilot: "Saut hyperspatial dans 3… 2… 1…"

      - if:
          condition: "has_provisions"
          then:
            - pilot: "Bon voyage. Vos provisions vous garderont en forme."
          else:
            - pilot: "Serrez les dents. Ce sera long sans ravitaillement."
            - set:
                reputation: "reputation - 1"

      - pilot: "Arrivée imminente. Préparez-vous."

      # ← Saut vers le chapitre 2 (autre fichier YAML)
      - goto: "chapter2.yaml#ch2_arrivee"

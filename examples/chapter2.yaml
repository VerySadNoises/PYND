# ============================================================
#  Chapitre 2 — Station Kepler-7
#  Chargé automatiquement depuis chapter1.yaml via goto.
#  Peut aussi être lancé directement :
#    python tools/cli.py run examples/chapter2.yaml
#  (les variables du chapitre 1 seront absentes → valeurs par défaut)
# ============================================================

characters:
  # settler et pilot sont déjà connus si chargés depuis chapter1 ;
  # ils sont ignorés si leurs ids existent déjà.
  settler:
    name: Settler
    image: assets/characters/Settler2.png
    position: left

  pilot:
    name: Pilote
    image: assets/characters/Pilot2.png
    position: right

  # Nouveau personnage propre à ce chapitre
  commandant:
    name: Commandant
    image: assets/characters/Pilot2.png
    position: right

scenes:

  - id: ch2_arrivee
    background: assets/bg/bg_spaceship.jpg
    music: assets/audio/Drifting Memories.ogg
    character_dim: 100

    characters:
      - settler
      - commandant

    actions:
      # Valeurs par défaut si ce chapitre est lancé seul
      - if:
          condition: "not player_name"
          then:
            - set:
                player_name: Inconnu
                credits: 80
                reputation: 3
                has_provisions: false

      - commandant: "Identification reçue. Bienvenue, {player_name}."

      - if:
          condition: "has_provisions"
          then:
            - settler: "Vos provisions ont été appréciées de l'équipage. +1 réputation."
            - set:
                reputation: "reputation + 1"
          else:
            - commandant: "Vous avez l'air épuisé. Pas de provisions ?"

      - commandant: "Réputation actuelle : {reputation}/10. Crédits : {credits}."

      - choice:
          - text: "Trader sur le marché (+60 crédits)"
            set:
              credits: "credits + 60"
              reputation: "reputation + 1"
            actions:
              - settler: "Transaction réussie ! Solde : {credits} crédits."

          - text: "Négocier un contrat (réputation ≥ 5 requise)"
            condition: "reputation >= 5"
            set:
              credits: "credits + 100"
              has_contract: true
            actions:
              - commandant: "Contrat signé. +100 crédits. Solde : {credits}."

          - text: "Repartir immédiatement"
            goto: ch2_depart

      - goto: ch2_bilan

  - id: ch2_bilan
    background: assets/bg/bg_spaceship.jpg
    character_dim: 120

    characters:
      - settler
      - commandant

    actions:
      - settler: "Bilan de votre passage à Kepler-7 :"
      - commandant: "Crédits : {credits}  |  Réputation : {reputation}/10"

      - if:
          condition: "credits >= 150 and reputation >= 5"
          then:
            - goto: ch2_fin_bonne
          else:
            - goto: ch2_fin_difficile

  - id: ch2_depart
    background: assets/bg/bg_spaceship.jpg
    character_dim: 150

    characters:
      - pilot

    actions:
      - pilot: "Départ précipité. Vous repartez avec {credits} crédits."
      - pilot: "Réputation : {reputation}/10. La galaxie vous attend."

  - id: ch2_fin_bonne
    background: assets/bg/bg_spaceship.jpg
    music: assets/audio/Drifting Memories.ogg
    character_dim: 60

    characters:
      - settler
      - commandant

    actions:
      - commandant: "Impressionnant, {player_name}."
      - settler: "{credits} crédits et {reputation}/10 de réputation."
      - commandant: "Vous avez l'étoffe d'un grand négociateur."

  - id: ch2_fin_difficile
    background: assets/bg/bg_spaceship.jpg
    character_dim: 180

    characters:
      - commandant

    actions:
      - commandant: "Résultat mitigé, {player_name}."
      - commandant: "{credits} crédits, {reputation}/10 de réputation."
      - commandant: "La prochaine station sera peut-être plus clémente."

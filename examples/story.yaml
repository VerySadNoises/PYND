# Characters defined once; referenced by id in all scenes.
characters:
  settler:
    name: Settler
    image: assets/characters/Settler2.png
    position: left

  captain:
    name: Capitaine
    image: assets/characters/Pilot2.png
    position: right

scenes:
  - id: intro
    music: assets/audio/Forgotten Biomes.ogg
    background: assets/bg/bg_spaceship.jpg

    # 0 = aucun assombrissement
    # 255 = personnage entièrement noir
    character_dim: 120

    characters:
      - settler
      - captain

    actions:
      - settler: "Welcome travelers! Are you ready for the journey?"
      - captain: "We depart at dawn. Have you made your decision?"

      - choice:
          - text: "Explorer"
            actions:
              - settler: "Excellent! Prepare yourself."
              - captain: "I'll set the course."
            goto: explore

          - text: "Rester"
            actions:
              - captain: "As you wish. Stay then."
            set:
              stayed: true
            goto: stay_scene

  - id: explore
    music: assets/audio/Drifting Memories.ogg
    background: assets/bg/bg_spaceship.jpg
    character_dim: 120

    characters:
      - settler
      - captain

    actions:
      # Marque la progression du joueur dans les variables
      - set:
          explored: true

      - captain: "Engines are online. We're heading out!"
      - settler: "I'll chart the stars."

      # Le joueur choisit son état d'esprit — la variable mood est stockée
      - choice:
          - text: "Ready for anything!"
            set:
              mood: confident
            actions:
              - settler: "That's the spirit!"
          - text: "I'm not sure about this..."
            set:
              mood: uncertain
            actions:
              - settler: "Don't worry — I'll guide you."

      # Dialogue conditionnel basé sur le choix précédent (action 'if')
      - if:
          condition: "mood == confident"
          then:
            - captain: "With that attitude, nothing can stop us!"
          else:
            - captain: "Together we'll face whatever lies ahead."

      - captain: "Then let us begin."

  - id: stay_scene
    background: assets/bg/bg_spaceship.jpg
    character_dim: 120

    characters:
      - captain

    actions:
      - captain: "You chose to stay. The ship departs without you."

      # L'option "Changer d'avis" est masquée car stayed == true ici ;
      # c'est un exemple de choix conditionnel verrouillé par variable.
      - choice:
          - text: "Wait, I changed my mind!"
            condition: "stayed != true"
            actions:
              - captain: "The ship has already left. It's too late."
          - text: "So be it. Farewell."
            actions:
              - captain: "Farewell, traveler. Perhaps our paths will cross again."